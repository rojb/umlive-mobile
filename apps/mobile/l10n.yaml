# Codegen settings for `flutter gen-l10n` (run automatically by
# `flutter pub get` because `generate: true` is set in pubspec.yaml).
#
# One locale, Spanish at launch (PRD-MOBILE.md §7, "Localization"). The
# generated sources land in lib/l10n/ next to the template and are ignored by
# git.
arb-dir: lib/l10n
template-arb-file: app_es.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
