org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is off on purpose.
#
# The plugin modules (`record_android`, `flutter_tts`) drag in KGP 2.2.21 while
# the app declares 2.4.0, and the incremental compiler cannot close its
# memory-mapped `.tab` caches on Windows across that skew:
#   Could not close incremental caches in build/<module>/kotlin/compileDebugKotlin/
#   cacheable/caches-jvm/jvm/kotlin: class-fq-name-to-source.tab, ...
# Killing the daemons and purging the caches does not fix it; the failure comes
# back on the next build. Without incremental caches there are no `.tab` files
# to close. The three Kotlin modules here are small, so the rebuild cost is
# negligible next to a build that fails outright.
kotlin.incremental=false
